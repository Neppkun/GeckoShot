# Packages the extension on every push and pull request, and publishes a
# GitHub Release with the CRX and ZIP when a version tag (v1.2.3) is pushed.
# The Playwright tests run locally (npm test), not here.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 26.12.1 is the October 2026 security release that blocks the
          # compromised eMudhra intermediate CAs; never go below it.
          node-version: ">=26.12.1 <27"
          check-latest: true
          cache: npm
      - run: node --version
      # Playwright is only needed for the tests; don't download its browsers.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi
      - run: npm run build
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: geckoshot
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: geckoshot
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "GeckoShot $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**Which file?** Chrome, Edge and Brave on Windows/macOS only allow extensions from the Web Store, so download the \`.zip\`, unzip it, and use *Load unpacked* on \`chrome://extensions\` (Developer mode). Helium, ungoogled-chromium and Chromium on Linux can install the \`.crx\` directly."
