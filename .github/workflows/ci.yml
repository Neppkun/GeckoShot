# Packages the extension on every push and pull request. When you publish a
# GitHub Release (written by hand, with its changelog), builds that tag and
# attaches the CRX and ZIP to it. The Playwright tests run locally
# (npm test), not here.
#
# To attach the files to a release that already exists, run this workflow
# manually: Actions > CI > Run workflow, with the release's tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the CRX and ZIP to (e.g. v1.0.0)
        required: true

permissions:
  contents: read

env:
  # Set when building for a release; empty for pushes and pull requests.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty (the default ref) except for manual runs.
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          # 26.12.1 is the October 2026 security release that blocks the
          # compromised eMudhra intermediate CAs; never go below it.
          node-version: ">=26.12.1 <27"
          check-latest: true
          cache: npm
      - run: node --version
      # Playwright is only needed for the tests; don't download its browsers.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check the tag matches manifest.json
        if: env.RELEASE_TAG
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match manifest.json version $version"
            exit 1
          fi
      - run: npm run build
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: geckoshot
          path: dist/*

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: geckoshot
          path: dist
      - name: Attach the CRX and ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
