<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Screenshots test page</title>
    <style>
      body { margin: 0; font: 16px sans-serif; }
      header { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: rgb(255, 0, 0); }
      main { padding-top: 60px; }
      .box { width: 300px; height: 200px; margin: 40px; background: rgb(0, 128, 0); }
      #tall { height: 3000px; background: linear-gradient(rgb(0, 0, 255), rgb(255, 255, 0)); }
    </style>
  </head>
  <body>
    <header>fixed header</header>
    <main>
      <div class="box" id="box">box</div>
      <p id="text">Some selectable text.</p>
      <svg id="svg" width="300" height="120"><rect width="300" height="120" fill="rgb(128, 0, 128)" /></svg>
      <div id="tall"></div>
    </main>
  </body>
</html>
